name: CheckUnusedFiles

on:
  # GitHubのActionsタブから手動で実行できるようにする
  workflow_dispatch:
  # masterブランチへのプッシュでも実行する
  push:
    branches:
      -master 

# 検出する不要なファイルのパターンを定義する環境変数
# --- 重要 ---
# プロジェクトのニーズに合わせて、これらのリストを変更してください。
# パターンはスペース区切りで指定します。
env:
  # 特定のファイル名(拡張子など)のパターン
  UNUSED_NAME_PATTERNS: "*.pdb *.ilk *.user *.ncb *.suo *.log *.dmp *.zip *.imgui.ini desktop.ini dxcompiler.dll dxil.dll"

  #ディレクトリ名のパターン
  UNUSED_DIR_PATTERNS: "Generated x64 Win32 arm64 .vs bin ipch Dump"

jobs:
  check-files:
    name: 不要なファイルを検索
    runs-on: nbuntu-  latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: 不要なファイルとディレクトリを検索(bash)
        run: |
          #ディレクトリ条件を構築(最初の不要な -o を後で削除)
          DIR_CONDITIONS=()
          for pattern in $UNUSED_DIR_PATTERNS; do
            DIR_CONDITIONS+=(-o -iname "$pattern")
          done
          unset DIR_CONDITIONS[0]

          #ディレクトリ条件を構築(最初の不要な -o を後で削除)
          NAME_CONDITIONS=()
          for pattern in $UNUSED_NAME_PATTERNS; do
            NAME_CONDITIONS+=(-o -iname "$pattern")
          done
          unset NAME_CONDITIONS[0]

          # 1回の find 実行で全件を検索
          # 1. .gitを除外
          # 2. 不要なディレクトリを検索(-type f)し、見つけたらパスを出力(-print)し、その中身を枝刈り(-prune)
          # 3. または(-o)不要ファイルを検索(-type f)し、パスを出力(-print)
          UNUSED_LIST=$(
          find . -path "./.git" -prune -o \
          \( \( "${DIR_CONDITIONS[@]}" \) -a -type d -print -prune \) -o\
          \( \( "${NAME_CONDITIONS[@]}" \) -a -type f -print \) \
          )

          # 検出結果があればエラーとして出力し、失敗させる
          if [ -n "$UNUSED_LIST" ]; then
            echo "::error::不要なファイルまたはディレクトリが見つかりました。"
            echo "$UNUSED_LIST"
            exit1
          fi

          echo"リポジトリはクリーンです。"
